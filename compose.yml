services:
  autolist:
    image: ayuanaa/autolist:1.24
    container_name: Autolist
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8585}:8080"
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      AUTOLIST_ACCESS_TOKEN: "${AUTOLIST_ACCESS_TOKEN:-}"
    volumes:
      - autolist_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  autolist_data:
    name: autolist_data
