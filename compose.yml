services:
  autolist:
    build: .
    image: autolist:1.01
    container_name: Autolist
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_PORT:-8585}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/CiaoBye/AutoList/main/unraid/autolist-icon.png"
      net.unraid.docker.managed: "dockerman"
      net.unraid.docker.webui: "http://[IP]:[PORT:8585]/"
    volumes:
      - ./data:/data
