name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      # 供应链加固：actions 固定到已验证 SHA，checkout 不持久化凭据（zizmor artipacked/unpinned-uses）。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app
      - name: Check JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/js/core.js
          node --check app/static/js/theme-init.js
          node --check docs/prototypes/autolist-directions.js
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate Compose, Dockerfile, and Unraid XML
        run: |
          set -euo pipefail
          trap 'rm -f .env' EXIT
          cp .env.example .env
          docker compose config --quiet
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          root = ElementTree.parse("unraid/my-Autolist.xml").getroot()
          assert root.findtext("Repository") == "autolist:1.24"
          assert root.findtext("Icon", "").endswith("/unraid/autolist-icon.png")
          assert "10001" in root.findtext("Requires", "")
          assert root.find("./Config[@Target='/data']") is not None
          assert root.find("./Config[@Target='AUTOLIST_ACCESS_TOKEN']") is not None
          assert root.find("./Config[@Target='AUTOLIST_REQUIRE_STRONG_TOKEN']") is not None
          assert root.find("./Config[@Target='MP_BASE_URL']") is not None
          assert root.find("./Config[@Target='TMDB_API_KEY']") is not None

          dockerfile = Path("Dockerfile").read_text(encoding="utf-8")
          assert "HEALTHCHECK" in dockerfile
          assert "AUTOLIST_ICON_URL" in dockerfile

          dockerignore = Path(".dockerignore").read_text(encoding="utf-8")
          for pattern in (".venv/", ".scratch/", "docs/", "tests/", "*.log", "*.db"):
              assert pattern in dockerignore, pattern
          PY
      - name: Build Docker image smoke test
        run: docker build --tag autolist:ci --build-arg PIP_INDEX_URL=https://pypi.org/simple .
      - name: Run Docker health smoke test
        run: |
          set -euo pipefail
          AUTOLIST_CI_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker volume create autolist-ci-data
          docker run --rm --user 0:0 -v autolist-ci-data:/data autolist:ci sh -c 'chown 10001:10001 /data'
          docker run --detach --name autolist-ci --publish 18085:8080 \
            --env AUTOLIST_ACCESS_TOKEN="$AUTOLIST_CI_TOKEN" \
            --env DATA_DIR=/data \
            --volume autolist-ci-data:/data \
            autolist:ci
          for _ in $(seq 1 45); do
            status="$(docker inspect --format '{{.State.Health.Status}}' autolist-ci 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs autolist-ci
              exit 1
            fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' autolist-ci)" = "healthy"
          curl --fail --silent --show-error http://127.0.0.1:18085/api/health
          curl --fail --silent --show-error \
            --header "X-AutoList-Token: $AUTOLIST_CI_TOKEN" \
            http://127.0.0.1:18085/api/settings -o /tmp/autolist-settings.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/autolist-settings.json").read_text(encoding="utf-8"))
          secret_fields = (
              "mp_api_key", "emby_api_key", "tmdb_api_key", "mdblist_api_key",
              "cookiecloud_key", "cookiecloud_password", "ai_api_key", "tr_password",
          )
          assert all(payload.get(field) == "" for field in secret_fields), payload
          PY
          curl --fail --silent --show-error http://127.0.0.1:18085/assets/autolist-icon.png -o /tmp/autolist-icon.png
          python -c 'import sys; data=open("/tmp/autolist-icon.png","rb").read(); assert data.startswith(b"\x89PNG\r\n\x1a\n") and len(data) > 1000'
          docker exec autolist-ci python -c 'import sqlite3; db=sqlite3.connect("/data/playlist-autodown.db"); result=db.execute("PRAGMA integrity_check").fetchall(); assert result == [("ok",)], result; assert not db.execute("PRAGMA foreign_key_check").fetchall()'
      - name: Cleanup Docker smoke test
        if: always()
        run: |
          docker logs --tail 100 autolist-ci 2>/dev/null || true
          docker rm --force autolist-ci 2>/dev/null || true
          docker volume rm autolist-ci-data 2>/dev/null || true
          docker image rm autolist:ci 2>/dev/null || true

  publish:
    name: Publish Docker Hub image (amd64)
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: dockerhub-publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check publishing credentials
        id: credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo '::warning::Set repository secret DOCKERHUB_TOKEN, then rerun CI to publish ayuanaa/autolist.'
          fi
      - name: Login to Docker Hub
        if: steps.credentials.outputs.available == 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username ayuanaa --password-stdin
      - name: Build and push versioned image
        if: steps.credentials.outputs.available == 'true'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import re; from pathlib import Path; print(re.search(r"APP_VERSION = \"([0-9]+\.[0-9]+)\"", Path("app/config.py").read_text()).group(1))')"
          docker build --platform linux/amd64 \
            --build-arg PIP_INDEX_URL=https://pypi.org/simple \
            --label "org.opencontainers.image.source=https://github.com/CiaoBye/AutoList" \
            --label "org.opencontainers.image.revision=$COMMIT_SHA" \
            --tag "ayuanaa/autolist:$VERSION" \
            --tag "ayuanaa/autolist:latest" .
          docker push "ayuanaa/autolist:$VERSION"
          docker push "ayuanaa/autolist:latest"
      - name: Logout
        if: always() && steps.credentials.outputs.available == 'true'
        run: docker logout
