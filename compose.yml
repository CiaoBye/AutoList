services:
  autolist:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${AUTOLIST_PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${AUTOLIST_PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        AUTOLIST_ICON_URL: ${AUTOLIST_ICON_URL:-https://raw.githubusercontent.com/CiaoBye/AutoList/9495fb38821549a6763f87e7e4d9b427815dba32/unraid/autolist-icon.png}
    image: autolist:1.20
    container_name: Autolist
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_PORT:-8585}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - app.healthcheck
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    labels:
      net.unraid.docker.icon: "${AUTOLIST_ICON_URL:-https://raw.githubusercontent.com/CiaoBye/AutoList/9495fb38821549a6763f87e7e4d9b427815dba32/unraid/autolist-icon.png}"
      net.unraid.docker.managed: "dockerman"
      net.unraid.docker.webui: "http://[IP]:[PORT:8585]/"
    volumes:
      - ./data:/data
